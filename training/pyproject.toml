[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "quoridor-alphazero"
version = "0.1.0"
description = "Reference AlphaZero training pipeline for Quoridor"
requires-python = ">=3.10"
dependencies = [
  "numpy>=2.0",
  "torch>=2.7,<3",
]

[project.scripts]
quoridor-az = "quoridor.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["quoridor*"]
